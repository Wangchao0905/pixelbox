# Pixel Box 服务端 docker compose
# ==================================================================
# 用法（在 forme-server 目录下）：
#   cp deploy/.env.production.example .env.local   # 填好密钥
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 查看日志：docker compose -f deploy/docker-compose.yml logs -f app
# 停止：    docker compose -f deploy/docker-compose.yml down
# ==================================================================

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: forme-server:1.0.0
    container_name: forme-app
    restart: unless-stopped

    # ⚠️ 这里**故意不写 ports**，只写 expose。
    # 不 publish 端口 = 公网根本连不到这个容器，
    # 只有同一内网里的 nginx 能访问，X-Forwarded-For 才可信。
    # 如果你为了图省事加上 `ports: ["8787:8787"]`，
    # 就等于把「伪造 XFF 绕过限流」的入口直接开到公网。
    expose:
      - '8787'

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # 显式确认容器内绑 0.0.0.0 是知情的（服务启动自检要求）
      ALLOW_PUBLIC_BIND: '1'
      PORT: '8787'
      DATA_DIR: /app/data
      # 其余全部密钥走 .env.local，不写进 compose 文件（会被 git 跟踪）
    env_file:
      - ../.env.local

    volumes:
      # ⚠️ 必须持久化。state.json 存着全部用户、点数、订单与退款记录，
      # 不挂卷的话容器一重建，用户余额和已支付订单全部归零 ——
      # 这是会直接引发资损和投诉的事故。
      - forme-data:/app/data

    networks:
      - forme-net

    # 日志轮转：不限制的话 json-file 驱动会把磁盘写满
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  nginx:
    image: nginx:1.27-alpine
    container_name: forme-nginx
    restart: unless-stopped

    # 只有 nginx 对公网开放
    ports:
      - '80:80'
      - '443:443'

    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/html:/var/www/html:ro

    depends_on:
      - app

    networks:
      - forme-net

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

volumes:
  forme-data:
    driver: local

networks:
  forme-net:
    driver: bridge
