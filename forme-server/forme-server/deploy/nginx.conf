# Pixel Box 服务端 nginx 反向代理
# ==================================================================
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/forme
#   sudo ln -s /etc/nginx/sites-available/forme /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书用 certbot 申请（会自动改写下面的 ssl_certificate 路径）：
#   sudo certbot --nginx -d pixeltoy.cn
# ==================================================================

# HTTP 全量跳 HTTPS。微信的合法域名只接受 HTTPS，
# 留一个可用的 http 端口只会让人误配。
server {
    listen 80;
    listen [::]:80;
    server_name pixeltoy.cn;

    # certbot 的验证路径必须放行，否则续期会失败
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pixeltoy.cn;

    # certbot 申请的证书路径
    ssl_certificate     /etc/letsencrypt/live/pixeltoy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixeltoy.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------
    # 请求体上限
    # ---------------------------------------------------------------
    # 服务端允许单张素材 20MB（http.mjs 的 MAX_BODY），
    # 这里必须 >= 它，否则大图会在 nginx 层被 413 掉，
    # 而应用日志里什么都看不到 —— 排查起来很费时间。
    client_max_body_size 25m;
    client_body_timeout 120s;

    # 访问日志
    access_log /var/log/nginx/forme-access.log;
    error_log  /var/log/nginx/forme-error.log;

    # ---------------------------------------------------------------
    # 反代到本机 Node
    # ---------------------------------------------------------------
    # 微信验证与支付回调不会携带登录凭据，必须显式关闭可能从上层
    # server/http 配置继承的 Basic Auth；否则微信会收到 401，后台保存失败。
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host             $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # ⚠️ X-Forwarded-For 必须用 $remote_addr **覆盖**，不能用
        # $proxy_add_x_forwarded_for（那是追加）。
        #
        # 原因：应用按「第一个 IP」限流。如果这里用追加，
        # 攻击者只要自己带一个 `X-Forwarded-For: 1.2.3.4`，
        # 到应用就是 `1.2.3.4, 真实IP`，取第一个 = 拿到伪造值，
        # 每次换一个 IP 就能绕过全部限流。覆盖则永远只有真实 IP。
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host             $host;

        # 图片生成要调上游模型，可能跑很久（LLM_TIMEOUT_MS 默认 180 秒），
        # 这里的超时必须大于它，否则 nginx 先断开，用户看到 504 但点数已被预扣。
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 生成结果直接落盘返回，不要让 nginx 缓存
        proxy_buffering off;
    }

    # ---------------------------------------------------------------
    # 静态图片
    # ---------------------------------------------------------------
    # 图片是不可变内容（fileId 唯一），可以长缓存。
    # 生产环境建议改成 CDN 直出，这里只是参考实现。
    location /api/files/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------------------------------------------------------
    # 小程序封面图（静态）
    # ---------------------------------------------------------------
    # 由 deploy/fetch-covers.mjs 下载后 rsync 到 /opt/forme/media/。
    #
    # 为什么不用外部图床：真机上 <Image> 加载远程图要求域名在
    # 「downloadFile 合法域名」白名单里。用第三方图床意味着
    # ① 多配一个白名单 ② 对方随时可能改地址或限流 ③ 商业产品里
    # 多一个不受控的运行时依赖。收到自有域名下则白名单本来就要配，白拿。
    #
    # ⚠️ default_type 不能省：media() 生成的文件名**没有扩展名**
    #   （https://images.unsplash.com/photo-1549490349-...?auto=format
    #    → photo-1549490349-8643362247b5）
    #   nginx 无从推断类型，默认会发 application/octet-stream，
    #   而部分客户端对非 image/* 的响应不渲染 —— 表现就是「封面空白」，
    #   和域名没配白名单长得一模一样，很难区分。
    location /media/ {
        alias /opt/forme/media/;
        default_type image/jpeg;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # ---------------------------------------------------------------
    # mock 接口双保险（可选）
    # ---------------------------------------------------------------
    # 应用在 MOCK_WECHAT=0 时根本不会注册这两条路由（返回 404）。
    # 如果你有灰度环境会临时开 MOCK_WECHAT=1，又想保证公网打不到，
    # 就取消下面注释。
    #
    # location ~ ^/api/pay/mock- {
    #     return 404;
    # }
}
