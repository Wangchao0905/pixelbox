# Pixel Box nginx（Docker 版）
# ==================================================================
# 与 deploy/nginx.conf 的唯一区别是 proxy_pass 指向 compose 的服务名 `app`
# 而不是 127.0.0.1 —— 容器之间靠 Docker 内网 DNS 互相寻址。
#
# 挂载位置见 docker-compose.yml：
#   ./nginx.docker.conf → /etc/nginx/conf.d/default.conf
# ==================================================================

server {
    listen 80;
    listen [::]:80;
    server_name pixeltoy.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pixeltoy.cn;

    ssl_certificate     /etc/letsencrypt/live/pixeltoy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixeltoy.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 必须 >= 应用侧上限 20MB（http.mjs 的 MAX_BODY）
    client_max_body_size 25m;

    location / {
        # 服务名 app，端口 8787（compose 里没有 publish，只有 expose）
        proxy_pass http://app:8787;
        proxy_http_version 1.1;

        # 覆盖而不是追加，防止客户端自带 X-Forwarded-For 伪造限流用的 IP
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Host              $host;

        # 出图要调上游模型，超时必须大于 LLM_TIMEOUT_MS（默认 180 秒）
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    location /api/files/ {
        proxy_pass http://app:8787;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
